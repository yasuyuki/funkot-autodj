name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      audit_only:
        description: Run dependency policy without tests or packaging
        type: boolean
        default: true
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.93"

jobs:
  gate:
    name: schedule gate
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.audit_only }}" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git log master --since="12 hours ago" -1 --pretty=%H | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: test (linux)
    needs: [gate]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ libclang-dev pkg-config libasound2-dev
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "${{ env.RUST_VERSION }}" }
      - uses: Swatinem/rust-cache@v2
      - name: Check README cache-version claims
        run: ./scripts/check-readme-cache-version.sh
      - name: cargo test --locked --workspace --release
        env: { CARGO_PROFILE_RELEASE_LTO: "false", RUST_TEST_THREADS: "1" }
        run: cargo test --locked --workspace --release
      - name: dev.sh runs the build of its own checkout
        run: ./scripts/test-dev-source-attribution.sh
      - name: Engine rejects the geometry admission mutation
        env: { CARGO_PROFILE_RELEASE_LTO: "false" }
        shell: bash
        run: |
          variant=$(mktemp -d)
          git archive HEAD | tar -xf - -C "$variant"
          python3 - "$variant/funkot-core/src/transition_geometry.rs" <<'PYTHON'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text()
          guard = "fade_out_end > prev_frames - prev_start"
          assert source.count(guard) == 1
          path.write_text(source.replace(guard, "false"))
          PYTHON
          set +e
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo test --locked --manifest-path "$variant/Cargo.toml" -p funkot-core --release --lib engine::tests::invalid_manual_correction_keeps_decks_queues_and_events_unchanged > /tmp/transition-engine-sensitivity.log 2>&1
          status=$?
          set -e
          cat /tmp/transition-engine-sensitivity.log
          test "$status" = 101
          grep -Fx 'test engine::tests::invalid_manual_correction_keeps_decks_queues_and_events_unchanged ... FAILED' /tmp/transition-engine-sensitivity.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: transition-engine-sensitivity
          path: /tmp/transition-engine-sensitivity.log
      - name: Engine detects navigation and first-live guard mutations
        env: { CARGO_PROFILE_RELEASE_LTO: "false", PYTHONDONTWRITEBYTECODE: "1" }
        run: |
          python3 -B - <<'PYTHON'
          import io, os, subprocess, tarfile, tempfile
          from pathlib import Path
          from verification.manual_navigation_mutations import NAVIGATION_MUTATIONS, ENGINE_MUTATION_EDITS
          from verification.first_live_mutations import FIRST_LIVE_MUTATIONS, FIRST_LIVE_ENGINE_MUTATIONS, ENGINE_MUTATION_EDITS as FIRST_LIVE_ENGINE_EDITS
          archive = subprocess.check_output(["git", "archive", "HEAD"])
          variants = NAVIGATION_MUTATIONS + tuple(item for item in FIRST_LIVE_MUTATIONS if item[3] is not None) + FIRST_LIVE_ENGINE_MUTATIONS
          adapter_edits = ENGINE_MUTATION_EDITS | FIRST_LIVE_ENGINE_EDITS
          for label, _, edits, test in variants:
              with tempfile.TemporaryDirectory() as temporary:
                  tree = Path(temporary)
                  with tarfile.open(fileobj=io.BytesIO(archive)) as source:
                      source.extractall(tree, filter="data")
                  module = "first_live.rs" if label.startswith("first_live_") else "manual_navigation.rs"
                  path = tree / "funkot-core/src" / module
                  text = path.read_text()
                  for original, broken in edits:
                      assert text.count(original) == 1
                      text = text.replace(original, broken)
                  path.write_text(text)
                  for filename, original, broken in adapter_edits.get(label, ()):
                      adapter = tree / filename
                      text = adapter.read_text()
                      assert text.count(original) == 1
                      adapter.write_text(text.replace(original, broken))
                  name = "engine::tests::" + test
                  env = dict(os.environ, CARGO_TARGET_DIR=str(Path.cwd() / "target"))
                  result = subprocess.run(["cargo", "test", "--locked", "--manifest-path", str(tree / "Cargo.toml"), "-p", "funkot-core", "--release", "--lib", name], env=env, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  print(result.stdout)
                  assert result.returncode == 101 and "test " + name + " ... FAILED" in result.stdout, label + ": missing real-engine counterexample"
                  print(label + " EXPECTED_FAIL")
          PYTHON

  transition-proof:
    name: Transition geometry proof
    needs: [gate]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        id: kani-cache
        with:
          path: /tmp/transition-kani-image.tar
          key: transition-kani-0.68.0-${{ hashFiles('verification/Dockerfile') }}
      - name: Check proof source attribution
        run: python3 -B -m unittest discover -s verification -p "test_*.py"
      - name: Prepare verifier
        run: |
          if [ -f /tmp/transition-kani-image.tar ]; then
            docker load -i /tmp/transition-kani-image.tar
          else
            ./scripts/check-transition-geometry.sh --setup
            docker save funkot-transition-kani:0.68.0 -o /tmp/transition-kani-image.tar
          fi
      - name: Prove production geometry
        run: ./scripts/check-transition-geometry.sh /tmp/transition-proof
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: transition-proof
          path: /tmp/transition-proof/
          if-no-files-found: error

  manual-navigation-proof:
    name: Manual navigation model
    needs: [gate]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/funkot-verification
          key: tlc-1.7.4-936a2620
      - name: Prepare TLC
        run: python3 -B verification/check_manual_navigation.py --setup
      - name: Check navigation ordering and counterexamples
        run: python3 -B verification/check_manual_navigation.py --output /tmp/manual-navigation-proof
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: manual-navigation-proof
          path: /tmp/manual-navigation-proof/
          if-no-files-found: error

  first-live-proof:
    name: First-live lifecycle model
    needs: [gate]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/funkot-verification
          key: tlc-1.7.4-936a2620
      - name: Prepare TLC
        run: python3 -B verification/check_manual_navigation.py --setup
      - name: Check first-live ordering and counterexamples
        run: python3 -B verification/check_manual_navigation.py --model first-live --output /tmp/first-live-proof
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: first-live-proof
          path: /tmp/first-live-proof/
          if-no-files-found: error

  windows-cache:
    name: cache and WAV ownership tests (windows)
    needs: [gate]
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM (for bindgen)
        shell: pwsh
        run: |
          $ver = "18.1.8"; $installer = Join-Path $env:RUNNER_TEMP "LLVM-$ver-win64.exe"; $dest = Join-Path $env:RUNNER_TEMP "llvm-$ver"
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-$ver/LLVM-$ver-win64.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/S","/D=$dest" -Wait
          $llvmBin = Join-Path $dest "bin"
          if (-not (Test-Path (Join-Path $llvmBin "libclang.dll"))) { throw "libclang.dll not found after LLVM install" }
          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=$llvmBin"
          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "${{ env.RUST_VERSION }}" }
      - uses: Swatinem/rust-cache@v2
        with: { key: windows-cache-tests }
      - name: cargo test --locked cache and ownership unit tests
        env: { CARGO_PROFILE_RELEASE_LTO: "false" }
        run: |
          cargo test --locked -p funkot-core --release cache::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p funkot-core --release owned_wav::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p funkot-cli --release --lib wav_write::

  dependency-policy:
    name: dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Check CI conditions and toolchain alignment
        run: python3 scripts/test-ci-gate.py
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: advisories licenses sources
          arguments: --locked

  package:
    name: package (${{ matrix.artifact }})
    needs: [gate, test, windows-cache, transition-proof, manual-navigation-proof, first-live-proof, dependency-policy]
    if: >-
      needs.gate.outputs.run == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, artifact: linux-x64 }
          - { os: windows-latest, artifact: windows-x64 }
          - { os: macos-latest, artifact: macos-arm64 }
    steps:
      - uses: actions/checkout@v5
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ libclang-dev pkg-config libasound2-dev zip
      - name: Install LLVM (Windows, for bindgen)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "18.1.8"; $installer = Join-Path $env:RUNNER_TEMP "LLVM-$ver-win64.exe"; $dest = Join-Path $env:RUNNER_TEMP "llvm-$ver"
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-$ver/LLVM-$ver-win64.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/S","/D=$dest" -Wait
          $llvmBin = Join-Path $dest "bin"
          if (-not (Test-Path (Join-Path $llvmBin "libclang.dll"))) { throw "libclang.dll not found after LLVM install" }
          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=$llvmBin"
          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "${{ env.RUST_VERSION }}" }
      - uses: Swatinem/rust-cache@v2
        with: { key: "package-${{ matrix.artifact }}" }
      - name: cargo build --locked --workspace --release
        run: cargo build --locked --workspace --release
      - name: Package CLI and SDK (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          zip -j "dist/funkot-autodj-${{ matrix.artifact }}.zip" target/release/funkot-autodj
          zip -j "dist/funkot-autodj-sdk-${{ matrix.artifact }}.zip" target/release/libfunkot_core.a include/funkot.h
          if [ "${{ runner.os }}" = "Linux" ]; then
            zip -j "dist/funkot-autodj-sdk-${{ matrix.artifact }}.zip" target/release/libfunkot_core.so
          else
            zip -j "dist/funkot-autodj-sdk-${{ matrix.artifact }}.zip" target/release/libfunkot_core.dylib
          fi
      - name: Package CLI and SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist,dist/cli,dist/sdk | Out-Null
          Copy-Item target/release/funkot-autodj.exe dist/cli/; Copy-Item target/release/funkot_core.dll,include/funkot.h dist/sdk/
          Get-ChildItem target/release -Filter 'funkot_core*.lib' | Copy-Item -Destination dist/sdk/
          Compress-Archive -Path dist/cli/* -DestinationPath "dist/funkot-autodj-${{ matrix.artifact }}.zip"
          Compress-Archive -Path dist/sdk/* -DestinationPath "dist/funkot-autodj-sdk-${{ matrix.artifact }}.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with: { path: artifacts }
      - name: Collect zip assets
        run: mkdir -p release-assets && find artifacts -type f -name '*.zip' -exec cp -t release-assets {} +
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
